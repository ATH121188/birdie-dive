<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Birdie Dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light;background:#EAF6E4}
body{margin:0}
:root {
  --bg: #EAF6E4;
  --bg2: #DDEFD5;
  --panel: #FFFFFF;
  --panel2: #FFF3B8;
  --line: #1F3A2B;
  --fg: #1F3A2B;
  --muted: #4A6657;
  --gold: #FFD23F;
  --ink: #1F3A2B;
  --good: #1A7048;
  --bad: #C23A33;
  --turf: #1F6B43;
  --turf2: #247750;
  --display: 'Baloo 2', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--body);
  padding-block: 10px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
main, .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
.hud-r { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.score { color: var(--gold); font-family: var(--mono); }
.chip button { all: unset; cursor: pointer; }

/* generic pieces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn.big { padding: 16px 18px; font-size: 17px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 18px; }
.inp:focus { border-color: var(--gold); outline: none; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.pts { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.pts.plus { color: var(--good); }
.pts.zero { color: var(--muted); }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list .row { padding: 9px 12px; background: var(--bg2); border-radius: 10px; }
.list .row.me { outline: 1px solid var(--gold); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }

/* lobby */
.title { font-size: clamp(34px, 11vw, 52px); line-height: 1; }
.title small { display: block; font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); letter-spacing: 0; margin-top: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
.sw.sel { border-color: var(--fg); }
.sw[disabled] { opacity: 0.25; cursor: default; }
.steps { display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.steps b { color: var(--fg); }

/* timer */
.timer { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; transition: width 0.1s linear; }
.timer.low i { background: var(--bad); }
.tline { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.tline .sec { font-family: var(--mono); font-size: 22px; color: var(--fg); }

/* questions */
.cat { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; color: var(--ink); }
.q { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 6vw, 26px); line-height: 1.25; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 15px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 17px; cursor: pointer; }
.opt .k { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--bg); font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt.picked { border-color: var(--gold); background: var(--panel2); }
.opt.right { border-color: var(--good); background: #153B2A; }
.opt.wrong { border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.kprompt { font-size: clamp(26px, 8vw, 36px); line-height: 1.1; }
.tiers { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.tiers span { padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; }
.locked { text-align: center; color: var(--muted); padding: 10px; }

/* green */
.stage { position: relative; display: flex; gap: 10px; align-items: stretch; }
.green { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 14px; border: 1px solid var(--line); touch-action: none; min-width: 0; flex: 1; }
.pw { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.trk { position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: 99px; touch-action: none; cursor: pointer; }
.trk.v { width: 22px; flex: 1; }
.trk.h { height: 22px; width: 100%; }
.trk .fill { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--panel2); border-radius: 99px; }
.trk .thumb { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--gold); }
.trk.v .thumb { left: -5px; }
.trk.h .thumb { top: -5px; }
.trk .mid { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 2px; background: var(--line); }
.trk.off { opacity: 0.5; pointer-events: none; }
.aimrow { display: flex; align-items: center; gap: 10px; }
.nudge { width: 44px; height: 44px; flex: none; border-radius: 12px; font-size: 18px; padding: 0; }
.readout { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); gap: 8px; }
.readout b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
.banner { text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.banner.sunk { background: #153B2A; border-color: var(--good); color: var(--good); }

/* standings bars */
.bar { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.stand { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--bg2); border-radius: 10px; }
.stand.me { outline: 1px solid var(--gold); }
.winner { font-size: clamp(28px, 9vw, 40px); line-height: 1.05; }
.sub { font-size: 13px; color: var(--muted); }

/* points pop-up */
.pop { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; text-align: center; animation: popIn 1.9s ease-out forwards; }
.pop-n { font-family: var(--display); font-weight: 700; font-size: 68px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--ink), 0 0 28px rgba(242, 212, 146, 0.45); }
.pop.big .pop-n { font-size: 88px; color: var(--good); text-shadow: 0 3px 0 var(--ink), 0 0 34px rgba(110, 231, 161, 0.55); }
.pop.zero .pop-n { color: var(--muted); text-shadow: 0 3px 0 var(--ink); font-size: 52px; }
.pop-l { margin-top: 8px; display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--fg); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); }
.conf { position: absolute; left: 50%; top: 40%; width: 9px; height: 9px; border-radius: 2px; background: var(--c); opacity: 0; animation: burst 1.1s ease-out forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
  24% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -62%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(0.95); }
}
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(420deg); }
}
.chip.score.bump { animation: bump 0.7s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.35); background: var(--gold); color: var(--ink); } 100% { transform: scale(1); } }
.list .row { animation: rise 0.35s ease-out both; }
.list .row:nth-child(2) { animation-delay: 0.07s; }
.list .row:nth-child(3) { animation-delay: 0.14s; }
.list .row:nth-child(4) { animation-delay: 0.21s; }
.list .row:nth-child(5) { animation-delay: 0.28s; }
.list .row:nth-child(n+6) { animation-delay: 0.35s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop { animation: popFade 1.9s linear forwards; }
  @keyframes popFade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .chip.score.bump, .list .row { animation: none; }
}

/* toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--gold); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; max-width: min(92vw, 420px); text-align: center; z-index: 20; }
@media (prefers-reduced-motion: reduce) { .timer i { transition: none; } .btn:active { transform: none; } }


/* ===== Sunny Clubhouse skin: light mint, chunky ink outlines, buttons that press down ===== */
h1, h2, h3 { font-weight: 800; letter-spacing: 0; }
.brand { font-size: 22px; font-weight: 800; line-height: 1; }
.hud-r { color: var(--fg); }
.chip { background: #fff; border: 2px solid var(--ink); font-weight: 800; padding: 4px 11px; color: var(--fg); }
button.chip { cursor: pointer; min-height: 30px; }
.chip.score { background: var(--gold); color: var(--ink); }
.card { background: #fff; border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding: 16px; margin-bottom: 5px; }
.btn { background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); font-weight: 800; transition: transform 0.06s, box-shadow 0.06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.gold { background: var(--gold); border-color: var(--ink); color: var(--ink); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:active { transform: none; }
.btn[disabled] { box-shadow: 0 2px 0 var(--ink); }
.inp { background: #fff; border: 2.5px solid var(--ink); font-weight: 700; }
.inp:focus { border-color: var(--ink); box-shadow: 0 0 0 4px var(--gold); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.list .row { background: var(--bg2); border-radius: 14px; }
.list .row.me { outline: none; background: var(--panel2); box-shadow: inset 0 0 0 2.5px var(--ink); }
.badge { background: var(--gold); border: 2px solid var(--ink); color: var(--ink); }
.dot { box-shadow: 0 0 0 2px var(--ink); }
.sw { box-shadow: inset 0 0 0 2.5px var(--ink); }
.sw.sel { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
.title small { color: var(--muted); font-weight: 700; }
.timer { height: 16px; background: #fff; border: 2.5px solid var(--ink); }
.timer i { background: #5BC8A8; border-right: 2.5px solid var(--ink); }
.timer.low i { background: #FF8A5B; }
.tline .sec { font-weight: 800; }
.cat { border: 2px solid var(--ink); color: var(--ink); }
.q { font-weight: 800; font-size: clamp(22px, 6.4vw, 28px); line-height: 1.15; background: #fff; border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 18px 16px; margin-bottom: 5px; }
.opts { gap: 14px; }
.opt { background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); font-weight: 800; transition: transform 0.06s, box-shadow 0.06s; }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opt .k { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid var(--ink); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; background: #FF8A5B; }
.opt:nth-child(2) .k { background: #FFD23F; }
.opt:nth-child(3) .k { background: #5BC8A8; }
.opt:nth-child(4) .k { background: #6FA8FF; }
.opt.picked { background: var(--panel2); transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); border-color: var(--ink); }
.opt.right { background: #C9F0DC; border-color: var(--ink); }
.opt.wrong { background: #FFD9D4; border-color: var(--ink); }
.opt.right.picked, .opt.wrong.picked { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tiers span { border: 2px solid var(--ink); color: var(--fg); background: #fff; font-weight: 700; }
.green { border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); margin-bottom: 5px; }
.trk { background: #fff; border: 2.5px solid var(--ink); }
.trk .fill { background: var(--panel2); }
.trk .thumb { background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.trk .mid { background: var(--ink); opacity: 0.35; }
.nudge { padding: 0; }
.readout b { font-weight: 500; }
.banner { background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 5px 0 var(--ink); border-radius: 20px; font-weight: 800; }
.banner.sunk { background: #C9F0DC; border-color: var(--ink); color: var(--good); }
.stand { background: var(--bg2); border-radius: 14px; }
.stand.me { outline: none; background: var(--panel2); box-shadow: inset 0 0 0 2.5px var(--ink); }
.bar { height: 10px; background: #fff; border: 2px solid var(--ink); }
.pop-n { color: var(--gold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.pop.big .pop-n { color: #5BC8A8; -webkit-text-stroke: 3px var(--ink); text-shadow: 0 5px 0 var(--ink); }
.pop.zero .pop-n { color: #fff; -webkit-text-stroke: 3px var(--ink); text-shadow: 0 4px 0 var(--ink); }
.pop-l { background: var(--ink); color: #fff; border: 0; }
#toast { border: 2.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
@keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.35); } 100% { transform: scale(1); } }
.brand { white-space: nowrap; font-size: 19px; }
.hud-r { gap: 6px; }
.chip { padding: 3px 9px; }

/* putting view */
.stage { display: block; }
.green { margin-bottom: 5px; }
.aimrow { display: flex; align-items: center; gap: 10px; }
.rowlab { width: 52px; flex: none; font-weight: 800; }
.aimrow .trk.h { flex: 1; }
.trk.h .fill { top: 0; bottom: auto; height: 100%; }
.hud-r{flex-wrap:wrap;justify-content:flex-end;gap:6px}.hud{align-items:flex-start}
.shoot{width:100%;margin:2px 0 4px}
/* tier strip on the reveal: your tier lights up */
.tiers.rv{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:center;padding:12px 8px 8px}
.tiers.rv span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px 2px;border-radius:12px;font-size:9px;line-height:1.15;white-space:nowrap;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s,box-shadow .4s}
.tiers.rv span i{font-style:normal;font-weight:800}
.tiers.rv span b{font-family:var(--mono);font-size:13px}
.tiers.rv .dim{opacity:.38;transform:scale(.94)}
.tiers.rv .hit{transform:scale(1.22);z-index:2;opacity:1;border-width:3px}
.tiers.rv .t10{background:#D9CBB5}.tiers.rv .t10.hit{background:#B59B7B;color:#3B2A1A;box-shadow:0 4px 0 #6E5338}
.tiers.rv .t25{background:#EEDFC2}.tiers.rv .t25.hit{background:#D8BE92;color:#4A3720;box-shadow:0 4px 0 #8A6D43}
.tiers.rv .t45{background:#D4F0E3}.tiers.rv .t45.hit{background:#6FD3A6;color:#0E3B27;box-shadow:0 0 14px 2px rgba(111,211,166,.8),0 4px 0 var(--ink)}
.tiers.rv .t65{background:#D3E6FB}.tiers.rv .t65.hit{background:#5AA7F2;color:#fff;box-shadow:0 0 16px 3px rgba(90,167,242,.85),0 4px 0 var(--ink)}
.tiers.rv .t85{background:#FFEFB8}.tiers.rv .t85.hit{background:linear-gradient(110deg,#FFC21A 30%,#FFF3A8 48%,#FFC21A 66%);background-size:250% 100%;animation:gl 1.6s linear infinite;color:#5A3A00;box-shadow:0 0 20px 5px rgba(255,200,40,.9),0 4px 0 var(--ink)}
.tiers.rv .t100{background:#E3F2FB}.tiers.rv .t100.hit{background:linear-gradient(120deg,#B9ECFF,#F4FBFF 30%,#C9B6FF 55%,#9FF0E6 80%,#B9ECFF);background-size:300% 100%;animation:gl 2.4s linear infinite;color:#12385A;box-shadow:0 0 24px 7px rgba(150,225,255,.95),0 4px 0 var(--ink)}
.tiers.rv .t100.hit::before,.tiers.rv .t100.hit::after,.tiers.rv .t85.hit::after{content:'';position:absolute;width:11px;height:11px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #7FD8FF);animation:tw 1.3s ease-in-out infinite}
.tiers.rv .t100.hit::before{top:2px;left:5px}.tiers.rv .t100.hit::after{bottom:3px;right:5px;animation-delay:.6s;width:8px;height:8px}
.tiers.rv .t85.hit::after{top:2px;right:4px;background:#FFFBE0;filter:drop-shadow(0 0 3px #FFE27A);width:9px;height:9px}
@keyframes gl{to{background-position:-250% 0}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.tiers.rv .hit,.tiers.rv .hit::before,.tiers.rv .hit::after{animation:none}}
/* luxury pass: the rarer the tier, the richer the finish */
.tiers.rv span{border-width:2px}
.tiers.rv .t10,.tiers.rv .t25{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tiers.rv .t45.hit,.tiers.rv .t65.hit{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.18),0 0 16px 3px rgba(111,211,166,.7),0 4px 0 var(--ink)}
.tiers.rv .t65.hit{background:linear-gradient(160deg,#8CC8FF,#3F8EE6 60%,#2F73C4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,40,.25),0 0 18px 3px rgba(90,167,242,.8),0 4px 0 var(--ink)}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  rnd = rnd || Math.random;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

      else if (s.st === 'no') label = 'Not accepted';
      else label = 'No answer';
      popPoints(q, label, q >= 85);
    }
    return {
      root: h('div', { class: 'col' }, head, box),
      update() {
        const rd = R['r' + r]; if (!rd || !rd.sc || rd === lastRd) return; lastRd = rd;
        if (rd.f === 'T' || !(rd.pend || []).length || rd.pend.every(p => 'ok' in p)) popMine(rd);
        const tot = totals();
        const order = S.pl.slice().sort((a, b) => (rd.sc[b] ? rd.sc[b].q : 0) - (rd.sc[a] ? rd.sc[a].q : 0));
        if (pl.f === 'T') {
          const t = TRIVIA[pl.q];
          head.replaceChildren(h('span', { class: 'label' }, 'Correct answer'), h('h2', { class: 'q' }, t[2]), h('p', { class: 'sub' }, t[1]));
          box.replaceChildren(h('div', { class: 'list' }, order.map(u => {
            const s = rd.sc[u] || { q: 0, none: true };
            const pick = s.none ? 'No answer' : t[2 + s.a];
            const sec = s.none ? '' : ' · ' + (s.ms / 1000 / TS).toFixed(1) + 's';
            return resRow(u, (s.ok ? '✓ ' : '✗ ') + pick + sec, 'Total ' + (tot[u] ? tot[u].t : 0), s.q);
          })));
        } else {
          const k = KRILL[pl.q];
          head.replaceChildren(h('span', { class: 'label' }, k.p), h('h2', { class: 'q' }, 'How deep did you go?'));
          const mine = rd.sc[uid], hitTp = mine && (mine.st === 'ok' || mine.st === 'vote') ? mine.tp : 0;
          const strip = h('div', { class: 'tiers rv' }, TIERS.map(t => h('span', { class: 't' + t[0] + (hitTp ? (t[0] === hitTp ? ' hit' : ' dim') : '') }, h('i', {}, t[1]), h('b', {}, t[0]))));
          const deep = Object.keys(k.t).map(Number).sort((a, b) => b - a).slice(0, 2).flatMap(tp => k.t[tp].split(',').map(x => x.split('|')[0].trim()).filter(Boolean));
          const rng = mulberry32(pl.s), ex = shuffle(deep, rng).slice(0, 4);
          box.replaceChildren(
            strip,
            h('div', { class: 'list' }, order.map(u => {
              const s = rd.sc[u] || { q: 0, st: 'none' };
              let badge = null, sub = 'Total ' + (tot[u] ? tot[u].t : 0), main;
              if (s.st === 'ok') { badge = h('span', { class: 'badge b' + s.tp }, tierName(s.tp) + ' ' + s.tp); main = '“' + s.a + '”' + (s.uq ? ' · only you, +10' : ''); }
              else if (s.st === 'vote') { badge = h('span', { class: 'badge' }, 'Group vote 25'); main = '“' + s.a + '”' + (s.uq ? ' · only you, +10' : ''); }
              else if (s.st === 'no') { main = '“' + s.a + '” · not accepted'; }
              else { main = s.a ? '“' + s.a + '”' : 'No answer'; }
              return resRow(u, main, sub, s.q || 0, badge);
            })),
            h('div', { class: 'card' }, h('span', { class: 'label' }, 'Deeper answers you could have gone for'), h('p', {}, ex.join(' · '))));
        }
      }
    };
  }

  // ---------- sliders ----------
  function slider(o) {
    const track = h('div', { class: 'trk ' + (o.vertical ? 'v' : 'h'), role: 'slider', tabindex: '0', 'aria-label': o.label });
    const fill = h('div', { class: 'fill' }), thumb = h('div', { class: 'thumb' });
    track.append(o.mid ? h('div', { class: 'mid' }) : fill, thumb);
    let v = o.value, dragging = false;
    const set = (nv, emit) => {
      nv = Math.round(clamp(nv, o.min, o.max) / o.step) * o.step; nv = Math.round(nv * 100) / 100; v = nv;
      const f = (v - o.min) / (o.max - o.min);
      if (o.vertical) { thumb.style.bottom = `calc(${f * 100}% - 15px)`; fill.style.height = f * 100 + '%'; } else { thumb.style.left = `calc(${f * 100}% - 15px)`; fill.style.width = f * 100 + '%'; }
      track.setAttribute('aria-valuenow', v);
      if (emit && o.onInput) o.onInput(v);
    };
    const fromEv = e => { const b = track.getBoundingClientRect(); const f = o.vertical ? 1 - (e.clientY - b.top) / b.height : (e.clientX - b.left) / b.width; set(o.min + f * (o.max - o.min), true); };
    track.addEventListener('pointerdown', e => { dragging = true; try { track.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } fromEv(e); e.preventDefault(); });
    track.addEventListener('pointermove', e => { if (dragging) fromEv(e); });
    const end = () => { dragging = false; };
    track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
    track.addEventListener('keydown', e => {
      const d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -1 : 0;
      if (d) { set(v + d * o.step, true); e.preventDefault(); }
    });
    set(o.value, false);
    return { el: track, set, get: () => v };
  }

  // ---------- handshake screen ----------
  function buildGate() {
    const pl = S.plan && S.plan[S.round], what = S.phase === 'putt' ? 'Putt' : S.phase === 'vote' ? 'Group vote' : (pl && pl.f === 'K' ? 'Deep answer' : 'Trivia');
    const list = h('div', { class: 'list' }), note = h('p', { class: 'sub' }, ''), t0 = Date.now();
    const skip = h('button', { class: 'btn gold', onclick: () => release() }, 'Start now');
    skip.hidden = true;
    function draw() {
      const ok = new Set(ackedBy());
      list.replaceChildren((S.pl || []).map(u => h('div', { class: 'row' + (u === uid ? ' me' : '') }, dotEl(u), h('span', { class: 'grow name' }, pName(u) + (u === uid ? ' (you)' : '')), h('span', { class: 'pts ' + (ok.has(u) ? 'plus' : 'zero') }, ok.has(u) ? '✓' : '…'))));
      const n = (S.pl || []).length, waiting = (S.pl || []).filter(u => !ok.has(u));
      note.textContent = waiting.length ? `Making sure everyone has the screen first. Waiting on ${waiting.slice(0, 3).map(pName).join(', ')}${waiting.length > 3 ? '…' : ''}.` : 'Everyone is in. Starting…';
      skip.hidden = !(isHost() && waiting.length && Date.now() - t0 > 3000);
      void n;
    }
    return {
      root: h('div', { class: 'col' }, h('span', { class: 'cat' }, what), h('h2', { class: 'q' }, 'Get ready'), note, list, skip),
      mounted() { draw(); },
      update() { draw(); },
      tick() { if (S.go === 0 && !AK[S.seq + '_' + uid] && Date.now() - lastAck > 2000) sendAck(true); if (isHost()) draw(); }
    };
  }

  // ---------- putt ----------
  function buildPutt() {
    const r = S.round, seed = S.plan[r].s, g = makeGreen(seed);
    let aim = 0, power = 50, locked = false, ok = false, raf = 0, sim = null, st0 = 0, popped = false;
    const cv = h('canvas', { class: 'green', 'aria-label': 'Putting green seen from behind the ball, with moving slope arrows' });
    const view = makeView(cv, g, seed);
    const timer = makeTimer();
    timer.label('Shoot when you are ready. Auto-shoots at zero');
    const aimOut = h('b', {}, ''), powOut = h('b', {}, '');
    const powS = slider({ min: 0, max: 100, step: 1, value: 50, label: 'Power', onInput: v => { power = v; changed(); } });
    const aimS = slider({ min: -25, max: 25, step: 0.5, value: 0, mid: true, label: 'Aim', onInput: v => { aim = v; changed(); } });
    const nud = d => () => { aimS.set(aim + d, true); };
    // slingshot: press below the ball and pull back. The arrow points away from your finger, and a longer pull means more power. Letting go shoots.
    cv.style.touchAction = 'none';
    let pull = null, startPt = null, moved = 0, drag = false;
    const pullTo = e => {
      if (locked || !ok) return;
      const t = view.touch(e);
      if (!startPt) startPt = { x: t.x, y: t.y };
      moved = Math.max(moved, Math.hypot(t.x - startPt.x, t.y - startPt.y));
      pull = { x: t.x, y: t.y, px: t.px, moved };
      if (moved >= 10) { powS.set(clamp((t.px - 14) / (0.17 * cv.clientHeight) * 100, 0, 100), true); aimS.set(clamp(t.aim, -25, 25), true); }
    };
    const endDrag = () => { drag = false; pull = null; startPt = null; moved = 0; };
    cv.addEventListener('pointerdown', e => { if (locked) return; drag = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } pullTo(e); e.preventDefault(); });
    cv.addEventListener('pointermove', e => { if (drag) pullTo(e); });
    cv.addEventListener('pointerup', () => {
      const go = drag && pull && pull.px >= 22 && moved >= 10 && !locked;
      endDrag();
      if (go) shoot();
    });
    cv.addEventListener('pointercancel', endDrag); cv.addEventListener('lostpointercapture', () => { if (drag) endDrag(); });
    const status = h('div', { class: 'banner' }, '');
    status.hidden = true;
    const shootBtn = h('button', { class: 'btn gold big shoot', onclick: () => shoot() }, 'SHOOT');
    function changed() {
      aim = aimS.get(); power = powS.get();
      aimOut.textContent = aim === 0 ? 'On the hole line' : Math.abs(aim).toFixed(1) + '° ' + (aim > 0 ? 'right' : 'left');
      powOut.textContent = '≈ ' + Math.round(flatFeet(power)) + ' ft on flat';
    }
    function shoot() {
      if (locked) return;
      locked = true; endDrag(); aim = aimS.get(); power = powS.get();
      powS.el.classList.add('off'); aimS.el.classList.add('off'); shootBtn.disabled = true; shootBtn.hidden = true;
      sim = simulate(g, aim, power); st0 = performance.now();
      status.textContent = 'Rolling…'; status.hidden = false;
      savePutt(r, aim, power, true, sim.t);
    }
    const pos = (path, t) => { const f = t / SAMPLE, i = Math.min(path.length / 2 - 1, Math.floor(f)), j = Math.min(path.length / 2 - 1, i + 1), k = clamp(f - i, 0, 1); return [path[2 * i] + (path[2 * j] - path[2 * i]) * k, path[2 * i + 1] + (path[2 * j + 1] - path[2 * i + 1]) * k]; };
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!sim) { view.draw(now, { aimUI: true, aim, power, pull: drag ? pull : null, balls: [{ x: 0, y: 0, col: '#FFFFFF' }] }); return; }
      const t = (now - st0) / 1000, tt = Math.min(t, sim.t), [ex, ey] = pos(sim.path, tt);
      let a = 1, s2 = 1, shake = 0;
      if (sim.fell && t > sim.t) { const tau = t - sim.t; a = clamp(1 - tau / 0.3, 0, 1); s2 = 1 - 0.5 * Math.min(tau / 0.3, 1); }
      if (sim.out === 'sunk' && t >= sim.t) a = 0;
      if (sim.pole && t >= sim.poleT) shake = Math.max(0, 1 - (t - sim.poleT) / 1.2);
      if (!popped && (sim.fell ? t >= sim.t + 0.3 : t >= sim.t)) {
        popped = true; view.splash(view.resultLines(sim), sim.out === 'sunk', now, true);
        status.textContent = 'Waiting for everyone else. All shots replay together.';
      }
      view.draw(now, { balls: [{ x: ex, y: ey, a, s: s2, col: '#FFFFFF' }], trails: [{ path: sim.path, tt, col: '#FFFFFF', a: 0.95, lw: 3.5 }], shake });
    }
    function layout() { ok = view.size(); }
    return {
      root: h('div', { class: 'col' }, timer.el,
        h('div', { class: 'stage' }, cv),
        h('div', { class: 'aimrow' }, h('span', { class: 'rowlab' }, 'Aim'), h('button', { class: 'btn nudge', 'aria-label': 'Aim left', onclick: nud(-0.5) }, '◀'), aimS.el, h('button', { class: 'btn nudge', 'aria-label': 'Aim right', onclick: nud(0.5) }, '▶')),
        h('div', { class: 'aimrow' }, h('span', { class: 'rowlab' }, 'Power'), powS.el),
        shootBtn,
        h('div', { class: 'readout' }, h('span', {}, 'Aim ', aimOut), h('span', {}, 'Power ', powOut)),
        h('p', { class: 'sub' }, 'Pull back below the ball like a slingshot and let go to shoot, or set the sliders and tap SHOOT. Drag right and the arrow swings left; a longer pull is more power. Arrows point downhill: faster and darker means steeper. Shoot on your own time, watch your ball, then everyone\'s shots replay together.'),
        status),
      mounted() { layout(); changed(); raf = requestAnimationFrame(frame); },
      resize() { layout(); },
      destroy() { cancelAnimationFrame(raf); },
      tick() { timer.tick(); if (!locked && left() <= 0) shoot(); },
      update() { if (!ok) layout(); }
    };
  }

  // ---------- replay ----------
  const tagWord = p => ({ sunk: 'Sunk', lip: 'Lip-out', inch: 'Inside 1 ft', near: 'Within 4 ft', miss: 'Miss', fell: 'Fell off' }[p.out] || 'Miss');
  function buildReplay() {
    const r = S.round, seed = S.plan[r].s, g = makeGreen(seed);
    const cv = h('canvas', { class: 'green', 'aria-label': 'Replay of every putt' });
    const view = makeView(cv, g, seed);
    const banner = h('div', { class: 'banner' }, 'Rolling…'), panel = h('div', { class: 'col' });
    panel.hidden = true;
    let ok = false, rd = null, t0 = 0, maxT = 0, done = false, raf = 0, started = false, popped = false;
    function popPutt(m, now) {
      if (popped || !m) return;
      popped = true;
      view.splash(view.resultLines(m), m.out === 'sunk', now == null ? performance.now() : now, true);
    }
    const pos = (path, t) => { const f = t / SAMPLE, i = Math.min(path.length / 2 - 1, Math.floor(f)), j = Math.min(path.length / 2 - 1, i + 1), k = clamp(f - i, 0, 1); return [path[2 * i] + (path[2 * j] - path[2 * i]) * k, path[2 * i + 1] + (path[2 * j + 1] - path[2 * i + 1]) * k]; };
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!ok) return;
      const t = started ? (now - t0) / 1000 : 0, trails = [], balls = [];
      let shake = 0; const tags = [];
      if (rd && started) {
        for (const u of S.pl.slice().sort((a, b) => (a === uid) - (b === uid))) {
          const p = rd.pt[u]; if (!p) continue;
          const tt = Math.min(t, p.t), [ex, ey] = pos(p.path, tt);
          trails.push({ path: p.path, tt, col: pCol(u), a: u === uid ? 0.95 : 0.6, lw: u === uid ? 3.5 : 3 });
          let a = 1, s = 1;
          if (p.fell && t > p.t) { const tau = t - p.t; a = clamp(1 - tau / 0.3, 0, 1); s = 1 - 0.5 * Math.min(tau / 0.3, 1); }
          if (p.out === 'sunk' && t >= p.t) a = 0;
          balls.push(u === uid ? { x: ex, y: ey, a, s, col: '#FFFFFF' } : { x: ex, y: ey, a: a * 0.9, s, col: pCol(u), r: 0.85 });
          if (u !== uid && (p.fell ? t >= p.t + 0.3 : t >= p.t)) { const wt = p.fell ? p.t + 0.3 : p.t; tags.push({ x: p.path[p.path.length - 2], y: p.path[p.path.length - 1], col: pCol(u), t0: now - Math.max(0, t - wt) * 1000, text: pName(u) + ' · ' + tagWord(p) + ' +' + p.p }); }
          if (p.pole && t >= p.poleT) shake = Math.max(shake, Math.max(0, 1 - (t - p.poleT) / 1.2));
        }
        const mine = rd.pt[uid];
        if (mine && (mine.fell ? t >= mine.t + 0.3 : t >= mine.t)) popPutt(mine, now);
        if (!done && t >= maxT + 0.4) finish();
      } else balls.push({ x: 0, y: 0, col: '#FFFFFF' });
      view.draw(now, { balls, trails, shake, tags });
    }
    function finish() {
      done = true; popPutt(rd.pt[uid]); showPanel();
    }
    function showPanel() {
      const mine = rd.pt[uid];
      if (mine) {
        banner.className = 'banner' + (mine.out === 'sunk' ? ' sunk' : '');
        banner.textContent = mine.out === 'sunk' ? 'Sunk it. +100' : mine.out === 'lip' ? 'Lipped out. +75' : mine.out === 'fell' ? (view.kind === 0 ? 'Over the cliff. +0' : 'Off the green. +0') : `${fmtDist(mine.d)} away${mine.p ? '. +' + mine.p : ''}`;
      }
      const sc = (R['r' + r] || {}).sc || {}, tot = totals();
      const order = S.pl.slice().sort((a, b) => (rd.pt[b] ? rd.pt[b].p : 0) - (rd.pt[a] ? rd.pt[a].p : 0));
      const label = p => p.out === 'sunk' ? 'Sunk' : p.out === 'lip' ? 'Lipped out' : p.out === 'fell' ? (view.kind === 0 ? 'Over the cliff' : 'Off the green') : fmtDist(p.d) + ' away';
      const rows = h('div', { class: 'list' }, order.map(u => { const p = rd.pt[u]; return resRow(u, p ? label(p) + (p.none ? ' (no putt set)' : '') : '', 'This round ' + (((sc[u] && sc[u].q) || 0) + (p ? p.p : 0)) + ' · Total ' + (tot[u] ? tot[u].t : 0), p ? p.p : 0); }));
      panel.replaceChildren(rows); panel.hidden = false;
    }
    function begin() { started = true; maxT = Math.max(0, ...S.pl.map(u => (rd.pt[u] ? rd.pt[u].t : 0))); t0 = performance.now(); }
    function layout() { ok = view.size(); }
    return {
      root: h('div', { class: 'col' }, h('div', { class: 'stage' }, cv), banner, panel),
      mounted() { layout(); raf = requestAnimationFrame(frame); },
      resize() { layout(); },
      tick() { if (started && !done && (performance.now() - t0) / 1000 >= maxT + 1.2) finish(); },
      destroy() { cancelAnimationFrame(raf); },
      update() {
        const rr = R['r' + r];
        if (!ok) layout();
        if (rr && rr.pt) { rd = rr; if (!started && ok) begin(); else if (done) showPanel(); }
      }
    };
  }

  // ---------- final ----------
  function buildFinal() {
    const box = h('div', { class: 'col' }), head = h('div', { class: 'col' });
    return {
      root: h('div', { class: 'col', style: 'gap:16px' }, head, box,
        isHost() ? h('button', { class: 'btn gold big', onclick: newGame }, 'Play again') : h('button', { class: 'btn big', onclick: newGame }, 'Start a new game'),
        isHost() ? null : h('p', { class: 'sub', style: 'text-align:center' }, 'Anyone can start the next game. Everyone lands in the new lobby.')),
      update() {
        const t = totals(), ids = Object.keys(t).sort((a, b) => t[b].t - t[a].t), top = ids.length ? t[ids[0]].t : 1;
        const winners = ids.filter(u => t[u].t === top);
        head.replaceChildren(h('span', { class: 'label' }, 'Final standings'), h('h1', { class: 'winner' }, winners.length > 1 ? 'Tie at the top: ' + winners.map(pName).join(' and ') : pName(winners[0]) + ' wins'), h('p', { class: 'sub' }, top + ' points over ' + NR + ' rounds'));
        box.replaceChildren(...ids.map((u, i) => h('div', { class: 'stand' + (u === uid ? ' me' : '') },
          h('div', { class: 'row' }, h('span', { class: 'mono muted' }, (i + 1) + '.'), dotEl(u), h('span', { class: 'grow name' }, pName(u)), h('span', { class: 'pts' }, t[u].t)),
          h('div', { class: 'bar' }, h('i', { style: `width:${top ? t[u].t / top * 100 : 0}%;background:${pCol(u)}` })),
          h('div', { class: 'sub' }, `Trivia ${t[u].qa} · Deep answers ${t[u].qk} · Putting ${t[u].p}`))));
      }
    };
  }

  // ---------- boot ----------
  refresh();
  try {
    const cl = window.claude;
    if (window.FIREBASE_CONFIG && window.firebase) {
      const fb = window.firebase;
      if (!fb.apps.length) fb.initializeApp(window.FIREBASE_CONFIG);
      const cred = await fb.auth().signInAnonymously();
      uid = cred.user.uid;
      db = fb.firestore();
      try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) { /* settings already applied */ }
    } else if (cl && cl.use) { db = await cl.use('db'); user = await cl.use('user'); }
  } catch (e) { console.warn(e); }
  if (user) { try { meInfo = await user.me(); uid = meInfo.id || (await user.id()); } catch (e) { console.warn(e); } }
  booting = false; curKey = null;
  if (!db || !uid) { refresh(); return; }
  lobbyRef().onSnapshot(snap => { S = snap.exists ? snap.data() : null; if (!S) { curGid = null; } onState(); }, dbErr);
  refresh();
})();

</script>
</body>
