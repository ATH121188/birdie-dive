<style>
html{color-scheme:dark;background:#0A1612}
body{margin:0}
/* Layout: one phone-width column. A thin HUD on top, one full-height "stage" per phase beneath it.
   Depth-gauge motif: tier badges and score bars read as ocean depth, the green is the one bright surface. */
:root {
  --bg: #0A1612;
  --bg2: #10231C;
  --panel: #142B22;
  --panel2: #1B382C;
  --line: #28493C;
  --fg: #EAF2EC;
  --muted: #8EA99C;
  --gold: #F2D492;
  --ink: #0A1612;
  --good: #6EE7A1;
  --bad: #FF6B6B;
  --turf: #1F6B43;
  --turf2: #247750;
  --display: 'Unbounded', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--body);
  padding-block: 10px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
main, .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
.hud-r { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.score { color: var(--gold); font-family: var(--mono); }
.chip button { all: unset; cursor: pointer; }

/* generic pieces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn.big { padding: 16px 18px; font-size: 17px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 18px; }
.inp:focus { border-color: var(--gold); outline: none; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.pts { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.pts.plus { color: var(--good); }
.pts.zero { color: var(--muted); }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list .row { padding: 9px 12px; background: var(--bg2); border-radius: 10px; }
.list .row.me { outline: 1px solid var(--gold); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }

/* lobby */
.title { font-size: clamp(34px, 11vw, 52px); line-height: 1; }
.title small { display: block; font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); letter-spacing: 0; margin-top: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
.sw.sel { border-color: var(--fg); }
.sw[disabled] { opacity: 0.25; cursor: default; }
.steps { display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.steps b { color: var(--fg); }

/* timer */
.timer { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; transition: width 0.1s linear; }
.timer.low i { background: var(--bad); }
.tline { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.tline .sec { font-family: var(--mono); font-size: 22px; color: var(--fg); }

/* questions */
.cat { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; color: var(--ink); }
.q { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 6vw, 26px); line-height: 1.25; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 15px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 17px; cursor: pointer; }
.opt .k { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--bg); font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt.picked { border-color: var(--gold); background: var(--panel2); }
.opt.right { border-color: var(--good); background: #153B2A; }
.opt.wrong { border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.kprompt { font-size: clamp(26px, 8vw, 36px); line-height: 1.1; }
.tiers { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.tiers span { padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; }
.locked { text-align: center; color: var(--muted); padding: 10px; }

/* green */
.stage { position: relative; display: flex; gap: 10px; align-items: stretch; }
.green { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 14px; border: 1px solid var(--line); touch-action: none; min-width: 0; flex: 1; }
.pw { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.trk { position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: 99px; touch-action: none; cursor: pointer; }
.trk.v { width: 22px; flex: 1; }
.trk.h { height: 22px; width: 100%; }
.trk .fill { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--panel2); border-radius: 99px; }
.trk .thumb { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--gold); }
.trk.v .thumb { left: -5px; }
.trk.h .thumb { top: -5px; }
.trk .mid { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 2px; background: var(--line); }
.trk.off { opacity: 0.5; pointer-events: none; }
.aimrow { display: flex; align-items: center; gap: 10px; }
.nudge { width: 44px; height: 44px; flex: none; border-radius: 12px; font-size: 18px; padding: 0; }
.readout { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); gap: 8px; }
.readout b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
.banner { text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.banner.sunk { background: #153B2A; border-color: var(--good); color: var(--good); }

/* standings bars */
.bar { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.stand { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--bg2); border-radius: 10px; }
.stand.me { outline: 1px solid var(--gold); }
.winner { font-size: clamp(28px, 9vw, 40px); line-height: 1.05; }
.sub { font-size: 13px; color: var(--muted); }

/* points pop-up */
.pop { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; text-align: center; animation: popIn 1.9s ease-out forwards; }
.pop-n { font-family: var(--display); font-weight: 700; font-size: 68px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--ink), 0 0 28px rgba(242, 212, 146, 0.45); }
.pop.big .pop-n { font-size: 88px; color: var(--good); text-shadow: 0 3px 0 var(--ink), 0 0 34px rgba(110, 231, 161, 0.55); }
.pop.zero .pop-n { color: var(--muted); text-shadow: 0 3px 0 var(--ink); font-size: 52px; }
.pop-l { margin-top: 8px; display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--fg); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); }
.conf { position: absolute; left: 50%; top: 40%; width: 9px; height: 9px; border-radius: 2px; background: var(--c); opacity: 0; animation: burst 1.1s ease-out forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
  24% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -62%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(0.95); }
}
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(420deg); }
}
.chip.score.bump { animation: bump 0.7s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.35); background: var(--gold); color: var(--ink); } 100% { transform: scale(1); } }
.list .row { animation: rise 0.35s ease-out both; }
.list .row:nth-child(2) { animation-delay: 0.07s; }
.list .row:nth-child(3) { animation-delay: 0.14s; }
.list .row:nth-child(4) { animation-delay: 0.21s; }
.list .row:nth-child(5) { animation-delay: 0.28s; }
.list .row:nth-child(n+6) { animation-delay: 0.35s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop { animation: popFade 1.9s linear forwards; }
  @keyframes popFade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .chip.score.bump, .list .row { animation: none; }
}

/* toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--gold); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; max-width: min(92vw, 420px); text-align: center; z-index: 20; }
@media (prefers-reduced-motion: reduce) { .timer i { transition: none; } .btn:active { transform: none; } }

</style>
</head>

  // ---------- putt ----------
  function buildPutt() {
    const r = S.round, g = makeGreen(S.plan[r].s);

    const cv = h('canvas', { class: 'green', 'aria-label': 'Putting green with slope arrows' });

    const aimS = slider({ min: -25, max: 25, step: 0.5, value: 0, mid: true, label: 'Aim', onInput: v => { aim = v; changed(); } });

    return {
      root: h('div', { class: 'col', style: 'gap:16px' }, head, box,
        isHost() ? h('button', { class: 'btn gold big', onclick: newGame }, 'Play again') : h('button', { class: 'btn big', onclick: newGame }, 'Start a new game'),
        isHost() ? null : h('p', { class: 'sub', style: 'text-align:center' }, 'Anyone can start the next game. Everyone lands in the new lobby.')),
      update() {
        const t = totals(), ids = Object.keys(t).sort((a, b) => t[b].t - t[a].t), top = ids.length ? t[ids[0]].t : 1;
        const winners = ids.filter(u => t[u].t === top);
        head.replaceChildren(h('span', { class: 'label' }, 'Final standings'), h('h1', { class: 'winner' }, winners.length > 1 ? 'Tie at the top: ' + winners.map(pName).join(' and ') : pName(winners[0]) + ' wins'), h('p', { class: 'sub' }, top + ' points over ' + NR + ' rounds'));
        box.replaceChildren(...ids.map((u, i) => h('div', { class: 'stand' + (u === uid ? ' me' : '') },
          h('div', { class: 'row' }, h('span', { class: 'mono muted' }, (i + 1) + '.'), dotEl(u), h('span', { class: 'grow name' }, pName(u)), h('span', { class: 'pts' }, t[u].t)),
          h('div', { class: 'bar' }, h('i', { style: `width:${top ? t[u].t / top * 100 : 0}%;background:${pCol(u)}` })),
          h('div', { class: 'sub' }, `Trivia ${t[u].qa} · Deep answers ${t[u].qk} · Putting ${t[u].p}`))));
      }
    };
  }

  // ---------- boot ----------
  refresh();
  try {
    const cl = window.claude;
    if (window.FIREBASE_CONFIG && window.firebase) {
      const fb = window.firebase;
      if (!fb.apps.length) fb.initializeApp(window.FIREBASE_CONFIG);
      const cred = await fb.auth().signInAnonymously();
      uid = cred.user.uid;
      db = fb.firestore();
    } else if (cl && cl.use) { db = await cl.use('db'); user = await cl.use('user'); }
  } catch (e) { console.warn(e); }
  if (user) { try { meInfo = await user.me(); uid = meInfo.id || (await user.id()); } catch (e) { console.warn(e); } }
  booting = false; curKey = null;
  if (!db || !uid) { refresh(); return; }
  lobbyRef().onSnapshot(snap => { S = snap.exists ? snap.data() : null; if (!S) { curGid = null; } onState(); }, dbErr);
  refresh();
})();

</script>
