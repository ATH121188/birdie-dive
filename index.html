<style>
html{color-scheme:dark;background:#0A1612}
body{margin:0}
/* Layout: one phone-width column. A thin HUD on top, one full-height "stage" per phase beneath it.
   Depth-gauge motif: tier badges and score bars read as ocean depth, the green is the one bright surface. */
:root {
  --bg: #0A1612;
  --bg2: #10231C;
  --panel: #142B22;
  --panel2: #1B382C;
  --line: #28493C;
  --fg: #EAF2EC;
  --muted: #8EA99C;
  --gold: #F2D492;
  --ink: #0A1612;
  --good: #6EE7A1;
  --bad: #FF6B6B;
  --turf: #1F6B43;
  --turf2: #247750;
  --display: 'Unbounded', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--body);
  padding-block: 10px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
main, .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
.hud-r { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.score { color: var(--gold); font-family: var(--mono); }
.chip button { all: unset; cursor: pointer; }

/* generic pieces */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn.big { padding: 16px 18px; font-size: 17px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.ghost { background: transparent; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 18px; }
.inp:focus { border-color: var(--gold); outline: none; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.name { font-weight: 700; overflow-wrap: anywhere; }
.pts { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.pts.plus { color: var(--good); }
.pts.zero { color: var(--muted); }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list .row { padding: 9px 12px; background: var(--bg2); border-radius: 10px; }
.list .row.me { outline: 1px solid var(--gold); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }

/* lobby */
.title { font-size: clamp(34px, 11vw, 52px); line-height: 1; }
.title small { display: block; font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); letter-spacing: 0; margin-top: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
.sw.sel { border-color: var(--fg); }
.sw[disabled] { opacity: 0.25; cursor: default; }
.steps { display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.steps b { color: var(--fg); }

/* timer */
.timer { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; transition: width 0.1s linear; }
.timer.low i { background: var(--bad); }
.tline { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.tline .sec { font-family: var(--mono); font-size: 22px; color: var(--fg); }

/* questions */
.cat { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; color: var(--ink); }
.q { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 6vw, 26px); line-height: 1.25; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 15px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 17px; cursor: pointer; }
.opt .k { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--bg); font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt.picked { border-color: var(--gold); background: var(--panel2); }
.opt.right { border-color: var(--good); background: #153B2A; }
.opt.wrong { border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.kprompt { font-size: clamp(26px, 8vw, 36px); line-height: 1.1; }
.tiers { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.tiers span { padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; }
.locked { text-align: center; color: var(--muted); padding: 10px; }

/* green */
.stage { position: relative; display: flex; gap: 10px; align-items: stretch; }
.green { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 14px; border: 1px solid var(--line); touch-action: none; min-width: 0; flex: 1; }
.pw { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.trk { position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: 99px; touch-action: none; cursor: pointer; }
.trk.v { width: 22px; flex: 1; }
.trk.h { height: 22px; width: 100%; }
.trk .fill { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--panel2); border-radius: 99px; }
.trk .thumb { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--gold); }
.trk.v .thumb { left: -5px; }
.trk.h .thumb { top: -5px; }
.trk .mid { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 2px; background: var(--line); }
.trk.off { opacity: 0.5; pointer-events: none; }
.aimrow { display: flex; align-items: center; gap: 10px; }
.nudge { width: 44px; height: 44px; flex: none; border-radius: 12px; font-size: 18px; padding: 0; }
.readout { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); gap: 8px; }
.readout b { color: var(--fg); font-family: var(--mono); font-weight: 500; }
.banner { text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.banner.sunk { background: #153B2A; border-color: var(--good); color: var(--good); }

/* standings bars */
.bar { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.stand { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--bg2); border-radius: 10px; }
.stand.me { outline: 1px solid var(--gold); }
.winner { font-size: clamp(28px, 9vw, 40px); line-height: 1.05; }
.sub { font-size: 13px; color: var(--muted); }

/* points pop-up */
.pop { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 30; pointer-events: none; text-align: center; animation: popIn 1.9s ease-out forwards; }
.pop-n { font-family: var(--display); font-weight: 700; font-size: 68px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--ink), 0 0 28px rgba(242, 212, 146, 0.45); }
.pop.big .pop-n { font-size: 88px; color: var(--good); text-shadow: 0 3px 0 var(--ink), 0 0 34px rgba(110, 231, 161, 0.55); }
.pop.zero .pop-n { color: var(--muted); text-shadow: 0 3px 0 var(--ink); font-size: 52px; }
.pop-l { margin-top: 8px; display: inline-block; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--fg); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); }
.conf { position: absolute; left: 50%; top: 40%; width: 9px; height: 9px; border-radius: 2px; background: var(--c); opacity: 0; animation: burst 1.1s ease-out forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
  24% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -62%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(0.95); }
}
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(420deg); }
}
.chip.score.bump { animation: bump 0.7s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 25% { transform: scale(1.35); background: var(--gold); color: var(--ink); } 100% { transform: scale(1); } }
.list .row { animation: rise 0.35s ease-out both; }
.list .row:nth-child(2) { animation-delay: 0.07s; }
.list .row:nth-child(3) { animation-delay: 0.14s; }
.list .row:nth-child(4) { animation-delay: 0.21s; }
.list .row:nth-child(5) { animation-delay: 0.28s; }
.list .row:nth-child(n+6) { animation-delay: 0.35s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop { animation: popFade 1.9s linear forwards; }
  @keyframes popFade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .chip.score.bump, .list .row { animation: none; }
}

/* toast */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--gold); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; max-width: min(92vw, 420px); text-align: center; z-index: 20; }
@media (prefers-reduced-motion: reduce) { .timer i { transition: none; } .btn:active { transform: none; } }

</style>
</head>

  for (const tier of tiers) {

function makePlan(nT, nK, rnd) {
  rnd = rnd || Math.random;

  for (let tries = 0; tries < 500 && !seq; tries++) {
    const s = shuffle(['T', 'T', 'T', 'T', 'T', 'K', 'K', 'K', 'K', 'K'], rnd);
    let d = 0, ok = true;
    for (const f of s) { d += f === 'T' ? 1 : -1; if (Math.abs(d) > 3) { ok = false; break; } }
    if (ok) seq = s;
  }
  seq = seq || ['T', 'K', 'T', 'K', 'T', 'K', 'T', 'K', 'T', 'K'];
  const tq = shuffle(Array.from({ length: nT }, (_, i) => i), rnd).slice(0, 5);

        const rd = R['r' + r]; if (!rd || built) return; built = true;
        const items = (rd.pend || []).filter(p => !p.u.includes(uid));
        if (!items.length) { box.replaceChildren(h('p', { class: 'locked' }, 'Nothing for you to vote on. The others are deciding.')); saveVotes(key, r); }
        else draw(items);
      }
    };
  }

  // ---------- reveal ----------
  function resRow(u, main, sub, ptsNum, badge) {
    return h('div', { class: 'row' + (u === uid ? ' me' : '') }, dotEl(u),
      h('div', { class: 'grow' }, h('div', { class: 'name' }, pName(u), badge ? ' ' : '', badge || null), main ? h('div', { class: 'sub' }, main) : null, sub ? h('div', { class: 'sub' }, sub) : null),
      h('span', { class: 'pts ' + (ptsNum > 0 ? 'plus' : 'zero') }, ordinalPts(ptsNum)));
  }
  function buildReveal() {
    const r = S.round, pl = S.plan[r], box = h('div', { class: 'col' }), head = h('div', { class: 'col' });
    let lastRd = null, popped = false;
    function popMine(rd) {
      const s = rd.sc[uid]; if (!s || popped) return;
      popped = true;
      const q = s.q || 0;
      let label;
      if (pl.f === 'T') label = s.none ? 'Too slow' : s.ok ? (q >= 90 ? 'Lightning fast!' : 'Correct!') : 'Not quite';
      else if (s.st === 'ok') label = tierName(s.tp) + (s.uq ? ' · only you!' : '');
      else if (s.st === 'vote') label = 'Group approved' + (s.uq ? ' · only you!' : '');
      else if (s.st === 'no') label = 'Not accepted';
      else label = 'No answer';
      popPoints(q, label, q >= 85);
    }
    return {
      root: h('div', { class: 'col' }, head, box),
      update() {
        const rd = R['r' + r]; if (!rd || !rd.sc || rd === lastRd) return; lastRd = rd;
        if (rd.f === 'T' || !(rd.pend || []).length || rd.pend.every(p => 'ok' in p)) popMine(rd);
        const tot = totals();
        const order = S.pl.slice().sort((a, b) => (rd.sc[b] ? rd.sc[b].q : 0) - (rd.sc[a] ? rd.sc[a].q : 0));
        if (pl.f === 'T') {
          const t = TRIVIA[pl.q];
          head.replaceChildren(h('span', { class: 'label' }, 'Correct answer'), h('h2', { class: 'q' }, t[2]), h('p', { class: 'sub' }, t[1]));
          box.replaceChildren(h('div', { class: 'list' }, order.map(u => {
            const s = rd.sc[u] || { q: 0, none: true };
            const pick = s.none ? 'No answer' : t[2 + s.a];
            const sec = s.none ? '' : ' · ' + (s.ms / 1000 / TS).toFixed(1) + 's';
            return resRow(u, (s.ok ? '✓ ' : '✗ ') + pick + sec, 'Total ' + (tot[u] ? tot[u].t : 0), s.q);
          })));
        } else {
          const k = KRILL[pl.q];
          head.replaceChildren(h('span', { class: 'label' }, k.p), h('h2', { class: 'q' }, 'How deep did you go?'));
          const deep = Object.keys(k.t).map(Number).sort((a, b) => b - a).slice(0, 2).flatMap(tp => k.t[tp].split(',').map(x => x.split('|')[0].trim()).filter(Boolean));
          const rng = mulberry32(pl.s), ex = shuffle(deep, rng).slice(0, 4);
          box.replaceChildren(
            h('div', { class: 'list' }, order.map(u => {
              const s = rd.sc[u] || { q: 0, st: 'none' };
              let badge = null, sub = 'Total ' + (tot[u] ? tot[u].t : 0), main;
              if (s.st === 'ok') { badge = h('span', { class: 'badge' }, tierName(s.tp) + ' ' + s.tp); main = '“' + s.a + '”' + (s.uq ? ' · only you, +10' : ''); }
              else if (s.st === 'vote') { badge = h('span', { class: 'badge' }, 'Group vote 25'); main = '“' + s.a + '”' + (s.uq ? ' · only you, +10' : ''); }
              else if (s.st === 'no') { main = '“' + s.a + '” · not accepted'; }
              else { main = s.a ? '“' + s.a + '”' : 'No answer'; }
              return resRow(u, main, sub, s.q || 0, badge);
            })),
            h('div', { class: 'card' }, h('span', { class: 'label' }, 'Deeper answers you could have gone for'), h('p', {}, ex.join(' · '))));
        }
      }
    };
  }

  // ---------- green drawing ----------
  function fit(g, w, hgt) {
    const x0 = Math.min(0, g.hx) - 4.2, x1 = Math.max(0, g.hx) + 4.2, y0 = -3.2, y1 = g.hy + 3.8;
    const s = Math.min(w / (x1 - x0), hgt / (y1 - y0));
    const ox = (w - (x1 - x0) * s) / 2, oy = (hgt - (y1 - y0) * s) / 2;
    return { s, x0, x1, y0, y1, X: x => ox + (x - x0) * s, Y: y => hgt - (oy + (y - y0) * s) };
  }
  function setupCanvas(cv) {
    const w = cv.clientWidth, hgt = cv.clientHeight;
    if (!w || !hgt) return null;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    const ctx = cv.getContext('2d');
    if (!ctx) return null;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h: hgt };
  }
  function drawGreen(c, g, xf, opt) {
    const { ctx, w, h: hgt } = c;
    ctx.clearRect(0, 0, w, hgt);
    ctx.fillStyle = '#1B5E3C'; ctx.fillRect(0, 0, w, hgt);
    // mowing bands
    for (let y = Math.floor(xf.y0 / 3) * 3, i = 0; y < xf.y1; y += 3, i++) {
      if (i % 2) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      ctx.fillRect(0, xf.Y(y + 3), w, xf.Y(y) - xf.Y(y + 3));
    }
    // slope arrows (point downhill, longer = steeper)
    const sp = 1.7;
    ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (let gx = Math.ceil(xf.x0 / sp) * sp; gx < xf.x1; gx += sp) {
      for (let gy = Math.ceil(xf.y0 / sp) * sp; gy < xf.y1; gy += sp) {
        if (Math.hypot(gx - g.hx, gy - g.hy) < 0.9 || Math.hypot(gx, gy) < 0.9) continue;
        const [sx, sy] = grade(g, gx, gy), m = Math.hypot(sx, sy), t = clamp(m / 0.05, 0, 1);
        const px = xf.X(gx), py = xf.Y(gy);
        if (m < 0.002) { ctx.fillStyle = 'rgba(234,242,236,0.3)'; ctx.beginPath(); ctx.arc(px, py, 1.4, 0, 7); ctx.fill(); continue; }
        const dx = -sx / m, dy = sy / m; // downhill in screen space (y flipped)
        const len = sp * xf.s * (0.22 + 0.6 * t), hs = Math.min(5.5, len * 0.45);
        const col = t > 0.62 ? `rgba(242,212,146,${0.55 + 0.4 * t})` : `rgba(234,242,236,${0.35 + 0.5 * t})`;
        ctx.strokeStyle = col; ctx.fillStyle = col;
        const x1 = px - dx * len / 2, y1 = py - dy * len / 2, x2 = px + dx * len / 2, y2 = py + dy * len / 2;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2 + dx * 1.5, y2 + dy * 1.5); ctx.lineTo(x2 - dx * hs - dy * hs * 0.65, y2 - dy * hs + dx * hs * 0.65); ctx.lineTo(x2 - dx * hs + dy * hs * 0.65, y2 - dy * hs - dx * hs * 0.65); ctx.closePath(); ctx.fill();
      }
    }
    // hole and flag
    const hx = xf.X(g.hx), hy = xf.Y(g.hy), hr = Math.max(6, HOLE_R * xf.s);
    ctx.fillStyle = '#04100B'; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(234,242,236,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#EAF2EC'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 40); ctx.stroke();
    ctx.fillStyle = '#FF6B6B'; ctx.beginPath(); ctx.moveTo(hx, hy - 40); ctx.lineTo(hx + 17, hy - 34); ctx.lineTo(hx, hy - 28); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#EAF2EC'; ctx.font = '500 12px "DM Mono", monospace'; ctx.textAlign = 'left';
    ctx.fillText(Math.round(g.D) + ' ft', hx + hr + 5, hy + 4);
    // start spot and aim marker
    const bx = xf.X(0), by = xf.Y(0);
    if (opt && opt.aim != null) {
      const th = Math.atan2(g.hx, g.hy) + opt.aim * Math.PI / 180, L = 2.6 * xf.s;
      const ex = bx + Math.sin(th) * L, ey = by - Math.cos(th) * L;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx + Math.sin(th) * 9, by - Math.cos(th) * 9); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath();
      ctx.moveTo(ex + Math.sin(th) * 7, ey - Math.cos(th) * 7); ctx.lineTo(ex - Math.cos(th) * 5, ey - Math.sin(th) * 5); ctx.lineTo(ex + Math.cos(th) * 5, ey + Math.sin(th) * 5); ctx.closePath(); ctx.fill();
    }
  }
  function drawBall(c, x, y, color) {
    const { ctx } = c;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(x + 1.5, y + 2, 6, 0, 7); ctx.fill();
    ctx.fillStyle = color || '#fff'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  }

  // ---------- sliders ----------
  function slider(o) {
    const track = h('div', { class: 'trk ' + (o.vertical ? 'v' : 'h'), role: 'slider', tabindex: '0', 'aria-label': o.label });
    const fill = h('div', { class: 'fill' }), thumb = h('div', { class: 'thumb' });
    track.append(o.mid ? h('div', { class: 'mid' }) : fill, thumb);
    let v = o.value, dragging = false;
    const set = (nv, emit) => {
      nv = Math.round(clamp(nv, o.min, o.max) / o.step) * o.step; nv = Math.round(nv * 100) / 100; v = nv;
      const f = (v - o.min) / (o.max - o.min);
      if (o.vertical) { thumb.style.bottom = `calc(${f * 100}% - 15px)`; fill.style.height = f * 100 + '%'; } else thumb.style.left = `calc(${f * 100}% - 15px)`;
      track.setAttribute('aria-valuenow', v);
      if (emit && o.onInput) o.onInput(v);
    };
    const fromEv = e => { const b = track.getBoundingClientRect(); const f = o.vertical ? 1 - (e.clientY - b.top) / b.height : (e.clientX - b.left) / b.width; set(o.min + f * (o.max - o.min), true); };
    track.addEventListener('pointerdown', e => { dragging = true; try { track.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } fromEv(e); e.preventDefault(); });
    track.addEventListener('pointermove', e => { if (dragging) fromEv(e); });
    const end = () => { dragging = false; };
    track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
    track.addEventListener('keydown', e => {
      const d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -1 : 0;
      if (d) { set(v + d * o.step, true); e.preventDefault(); }
    });
    set(o.value, false);
    return { el: track, set, get: () => v };
  }

  // ---------- putt ----------
  function buildPutt() {
    const r = S.round, g = makeGreen(S.plan[r].s);
    let aim = 0, power = 50, locked = false, c = null, xf = null, saveT = null;
    const cv = h('canvas', { class: 'green', 'aria-label': 'Putting green with slope arrows' });
    const timer = makeTimer();
    timer.label('Your ball launches at zero');
    const aimOut = h('b', {}, ''), powOut = h('b', {}, '');
    const powS = slider({ min: 0, max: 100, step: 1, value: 50, vertical: true, label: 'Power', onInput: v => { power = v; changed(); } });
    const aimS = slider({ min: -25, max: 25, step: 0.5, value: 0, mid: true, label: 'Aim', onInput: v => { aim = v; changed(); } });
    const nud = d => () => { aimS.set(aim + d, true); };
    const status = h('div', { class: 'banner' }, 'Struck. Watch the replay.');
    status.hidden = true;
    function changed() {
      aim = aimS.get(); power = powS.get();
      aimOut.textContent = aim === 0 ? 'On the hole line' : Math.abs(aim).toFixed(1) + '° ' + (aim > 0 ? 'right' : 'left');
      powOut.textContent = '≈ ' + Math.round(flatFeet(power)) + ' ft on flat';
      draw();
      clearTimeout(saveT); saveT = setTimeout(() => { if (!locked) savePutt(r, aim, power); }, 800);
    }
    function draw() { if (!c) return; drawGreen(c, g, xf, { aim }); drawBall(c, xf.X(0), xf.Y(0), '#fff'); }
    function lock() { locked = true; powS.el.classList.add('off'); aimS.el.classList.add('off'); status.hidden = false; clearTimeout(saveT); savePutt(r, aim, power); }
    function layout() { c = setupCanvas(cv); if (c) { xf = fit(g, c.w, c.h); draw(); } }
    return {
      root: h('div', { class: 'col' }, timer.el,
        h('div', { class: 'stage' }, cv, h('div', { class: 'pw' }, h('span', { class: 'label' }, 'Power'), powS.el)),
        h('div', { class: 'aimrow' }, h('button', { class: 'btn nudge', 'aria-label': 'Aim left', onclick: nud(-0.5) }, '◀'), aimS.el, h('button', { class: 'btn nudge', 'aria-label': 'Aim right', onclick: nud(0.5) }, '▶')),
        h('div', { class: 'readout' }, h('span', {}, 'Aim ', aimOut), h('span', {}, 'Power ', powOut)),
        h('p', { class: 'sub' }, 'Arrows point downhill. Longer, brighter arrows are steeper. Your ball goes straight at the hole with medium power if you do nothing.'),
        status),
      mounted() { layout(); changed(); },
      resize() { layout(); },
      tick() { timer.tick(); if (!locked && left() <= 0) lock(); },
      update() { if (!c) layout(); }
    };
  }

  // ---------- replay ----------
  function buildReplay() {
    const r = S.round, g = makeGreen(S.plan[r].s);
    const cv = h('canvas', { class: 'green', 'aria-label': 'Replay of every putt' });
    const banner = h('div', { class: 'banner' }, 'Rolling…'), panel = h('div', { class: 'col' });
    panel.hidden = true;
    let c = null, xf = null, rd = null, t0 = 0, maxT = 0, done = false, raf = 0, started = false, popped = false;
    function popPutt(m) {
      if (popped || !m) return;
      popped = true;
      const label = m.out === 'sunk' ? 'Sunk it!' : m.out === 'lip' ? 'Lipped out' : m.out === 'inch' ? 'Inside a foot' : m.out === 'near' ? 'Within 4 ft' : 'Missed';
      popPoints(m.p, label, m.out === 'sunk');
    }
    const pos = (path, t) => { const f = t / SAMPLE, i = Math.min(path.length / 2 - 1, Math.floor(f)), j = Math.min(path.length / 2 - 1, i + 1), k = clamp(f - i, 0, 1); return [path[2 * i] + (path[2 * j] - path[2 * i]) * k, path[2 * i + 1] + (path[2 * j + 1] - path[2 * i + 1]) * k]; };
    function frame() {
      if (!c || !rd) return;
      const t = (performance.now() - t0) / 1000;
      drawGreen(c, g, xf, null);
      const { ctx } = c;
      for (const u of S.pl) {
        const p = rd.pt[u]; if (!p) continue;
        const tt = Math.min(t, p.t), n = Math.min(p.path.length / 2 - 1, Math.floor(tt / SAMPLE));
        ctx.strokeStyle = pCol(u); ctx.globalAlpha = u === uid ? 0.95 : 0.6; ctx.lineWidth = u === uid ? 3.5 : 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(xf.X(p.path[0]), xf.Y(p.path[1]));
        for (let i = 1; i <= n; i++) ctx.lineTo(xf.X(p.path[2 * i]), xf.Y(p.path[2 * i + 1]));
        const [ex, ey] = pos(p.path, tt); ctx.lineTo(xf.X(ex), xf.Y(ey)); ctx.stroke(); ctx.globalAlpha = 1;
      }
      const mine = rd.pt[uid];
      if (mine) { const [ex, ey] = pos(mine.path, Math.min(t, mine.t)); if (!(mine.out === 'sunk' && t >= mine.t)) drawBall(c, xf.X(ex), xf.Y(ey), '#fff'); if (t >= mine.t) popPutt(mine); }
      if (!done && t >= maxT + 0.4) finish();
      if (!done || t < maxT + 1) raf = requestAnimationFrame(frame);
    }
    function finish() {
      done = true; popPutt(rd.pt[uid]); showPanel();
    }
    function showPanel() {
      const mine = rd.pt[uid];
      if (mine) {
        banner.className = 'banner' + (mine.out === 'sunk' ? ' sunk' : '');
        banner.textContent = mine.out === 'sunk' ? 'Sunk it. +100' : mine.out === 'lip' ? 'Lipped out. +75' : `${fmtDist(mine.d)} away${mine.p ? '. +' + mine.p : ''}`;
      }
      const sc = (R['r' + r] || {}).sc || {}, tot = totals();
      const order = S.pl.slice().sort((a, b) => (rd.pt[b] ? rd.pt[b].p : 0) - (rd.pt[a] ? rd.pt[a].p : 0));
      const label = p => p.out === 'sunk' ? 'Sunk' : p.out === 'lip' ? 'Lipped out' : fmtDist(p.d) + ' away';
      const rows = h('div', { class: 'list' }, order.map(u => { const p = rd.pt[u]; return resRow(u, p ? label(p) + (p.none ? ' (no putt set)' : '') : '', 'This round ' + (((sc[u] && sc[u].q) || 0) + (p ? p.p : 0)) + ' · Total ' + (tot[u] ? tot[u].t : 0), p ? p.p : 0); }));
      panel.replaceChildren(rows); panel.hidden = false;
    }
    function begin() { started = true; maxT = Math.max(0, ...S.pl.map(u => (rd.pt[u] ? rd.pt[u].t : 0))); t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
    function layout() { c = setupCanvas(cv); if (c) { xf = fit(g, c.w, c.h); if (!rd) drawGreen(c, g, xf, null); } }
    return {
      root: h('div', { class: 'col' }, h('div', { class: 'stage' }, cv), banner, panel),
      mounted() { layout(); },
      resize() { layout(); },
      tick() { if (started && !done && (performance.now() - t0) / 1000 >= maxT + 1.2) finish(); },
      destroy() { cancelAnimationFrame(raf); },
      update() {
        const rr = R['r' + r];
        if (!c) layout();
        if (rr && rr.pt) { rd = rr; if (!started && c) begin(); else if (done) showPanel(); }
      }
    };
  }

  // ---------- final ----------
  function buildFinal() {
    const box = h('div', { class: 'col' }), head = h('div', { class: 'col' });
    return {
      root: h('div', { class: 'col', style: 'gap:16px' }, head, box,
        isHost() ? h('button', { class: 'btn gold big', onclick: newGame }, 'Play again') : h('button', { class: 'btn big', onclick: newGame }, 'Start a new game'),
        isHost() ? null : h('p', { class: 'sub', style: 'text-align:center' }, 'Anyone can start the next game. Everyone lands in the new lobby.')),
      update() {
        const t = totals(), ids = Object.keys(t).sort((a, b) => t[b].t - t[a].t), top = ids.length ? t[ids[0]].t : 1;
        const winners = ids.filter(u => t[u].t === top);
        head.replaceChildren(h('span', { class: 'label' }, 'Final standings'), h('h1', { class: 'winner' }, winners.length > 1 ? 'Tie at the top: ' + winners.map(pName).join(' and ') : pName(winners[0]) + ' wins'), h('p', { class: 'sub' }, top + ' points over ' + NR + ' rounds'));
        box.replaceChildren(...ids.map((u, i) => h('div', { class: 'stand' + (u === uid ? ' me' : '') },
          h('div', { class: 'row' }, h('span', { class: 'mono muted' }, (i + 1) + '.'), dotEl(u), h('span', { class: 'grow name' }, pName(u)), h('span', { class: 'pts' }, t[u].t)),
          h('div', { class: 'bar' }, h('i', { style: `width:${top ? t[u].t / top * 100 : 0}%;background:${pCol(u)}` })),
          h('div', { class: 'sub' }, `Trivia ${t[u].qa} · Deep answers ${t[u].qk} · Putting ${t[u].p}`))));
      }
    };
  }

  // ---------- boot ----------
  refresh();
  try {
    const cl = window.claude;
    if (window.FIREBASE_CONFIG && window.firebase) {
      const fb = window.firebase;
      if (!fb.apps.length) fb.initializeApp(window.FIREBASE_CONFIG);
      const cred = await fb.auth().signInAnonymously();
      uid = cred.user.uid;
      db = fb.firestore();
    } else if (cl && cl.use) { db = await cl.use('db'); user = await cl.use('user'); }
  } catch (e) { console.warn(e); }
  if (user) { try { meInfo = await user.me(); uid = meInfo.id || (await user.id()); } catch (e) { console.warn(e); } }
  booting = false; curKey = null;
  if (!db || !uid) { refresh(); return; }
  lobbyRef().onSnapshot(snap => { S = snap.exists ? snap.data() : null; if (!S) { curGid = null; } onState(); }, dbErr);
  refresh();
})();

</script>
